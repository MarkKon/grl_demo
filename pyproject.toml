[project]
name = "grl-project"
version = "0.1.0"
description = "Inductive-bias experiments for GNN subset heuristics in star discrepancy search"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0",
    "torch>=2.12.1",
    "tqdm>=4.68.3",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = [
    ".",
]
